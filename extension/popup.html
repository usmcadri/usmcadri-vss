<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VSS Tools</title>

  <link rel="stylesheet" href="../static/styles.css" />

  <style>
    /* ── Compact popup overrides ── */
    body {
      background: var(--panel-bg);
      width: 300px;
      min-height: auto;
    }
    .layout {
      grid-template-columns: 1fr;
      min-height: auto;
    }
    .controls {
      display: flex;
      border-right: none;
      padding: 10px 12px;
      gap: 10px;
    }
    .viewerWrap { display: none; }
    .topbar__toggle { display: none; }
    .topbar { padding: 0 14px; height: 44px; }
    .card { padding: 10px 12px; gap: 8px; }
    .card__title { font-size: 0.68rem; }

    /* Open web-app link */
    .open-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition);
    }
    .open-link:hover { background: var(--border); text-decoration: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__logo" aria-hidden="true">👁</div>
    <div class="topbar__title">VSS Tools</div>
  </header>

  <main class="layout">
    <aside class="controls" id="controls">

      <!-- Preset -->
      <section class="card">
        <h2 class="card__title">Preset</h2>
        <label class="field">
          <span class="field__label">Category</span>
          <select id="presetCategory" class="field__control">
            <option value="whiteBalance">White Balance</option>
            <option value="visionCondition">Vision Condition</option>
            <option value="noir">Filter (NoIR-style)</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">Preset</span>
          <select id="presetName" class="field__control"></select>
        </label>
        <div class="hint">Applied to the current tab.</div>
      </section>

      <!-- Intensity -->
      <section class="card">
        <h2 class="card__title">Intensity</h2>
        <label class="field">
          <span class="field__label">Overlay strength</span>
          <input id="overlayAlpha" class="field__control" type="range" min="0" max="100" value="35" />
        </label>
        <div class="row">
          <div class="pill" id="overlayAlphaValue">35%</div>
          <button class="button" id="reset">Reset</button>
        </div>
      </section>

      <!-- Text -->
      <section class="card">
        <h2 class="card__title">Text</h2>
        <label class="field">
          <span class="field__label">Font size</span>
          <input id="fontSize" class="field__control" type="range" min="14" max="28" value="18" />
        </label>
        <div class="pill" id="fontSizeValue">18px</div>
        <label class="field">
          <span class="field__label">Line height</span>
          <input id="lineHeight" class="field__control" type="range" min="1.2" max="2.0" step="0.05" value="1.6" />
        </label>
        <div class="pill" id="lineHeightValue">1.6</div>
      </section>

      <!-- Reading highlight toggle -->
      <section class="card">
        <h2 class="card__title">Reading</h2>
        <label class="toggle">
          <input type="checkbox" class="toggle__input" id="rulerToggle" checked />
          <span class="toggle__track"></span>
          <span class="toggle__label">Reading ruler</span>
        </label>
        <div class="hint">Highlights the current line while browsing.</div>
      </section>

      <!-- Open web app -->
      <a class="open-link" href="http://127.0.0.1:5000" target="_blank">
        📂 Open Document Viewer
      </a>

    </aside>
  </main>

  <script src="../static/app.js"></script>
  <script src="popup.js"></script>
  <script>
    // ── Send settings to the active tab via content script ──
    function broadcastToTab() {
      const state = {
        presetCategory: document.getElementById("presetCategory")?.value,
        presetName:     document.getElementById("presetName")?.value,
        overlayAlpha:   document.getElementById("overlayAlpha")?.value,
        fontSize:       document.getElementById("fontSize")?.value,
        lineHeight:     document.getElementById("lineHeight")?.value,
        rulerEnabled:   document.getElementById("rulerToggle")?.checked,
      };
      chrome.tabs.query({ active: true, currentWindow: true }, tabs => {
        if (tabs[0]) {
          chrome.tabs.sendMessage(tabs[0].id, { type: "VSS_SETTINGS", state })
            .catch(() => {/* tab may not have content script */});
        }
      });
    }

    const watchIds = ["presetCategory","presetName","overlayAlpha","fontSize","lineHeight"];
    watchIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", broadcastToTab);
    });
    document.getElementById("rulerToggle")?.addEventListener("change", broadcastToTab);
  </script>
</body>
</html>
