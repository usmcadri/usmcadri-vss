<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VSS Tools</title>

  <!-- Reuse shared UI styles -->
  <link rel="stylesheet" href="../static/styles.css" />

  <style>
    /* Make the popup compact */
    body { background: var(--panel-bg); }
    .layout { grid-template-columns: 1fr; min-height: auto; }
    .controls { display: block; border-right: none; }
    .viewerWrap { display: none; }
    .topbar__toggle { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">VSS Tools</div>
  </header>

  <main class="layout">
    <aside class="controls" id="controls">
      <section class="card">
        <h2 class="card__title">Preset</h2>

        <label class="field">
          <span class="field__label">Category</span>
          <select id="presetCategory" class="field__control">
            <option value="accessibility">Accessibility</option>
            <option value="visual">Visual Comfort</option>
            <option value="contrast">Contrast</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Preset</span>
          <select id="presetName" class="field__control"></select>
        </label>

        <div class="hint">Settings are saved in this extension.</div>
      </section>

      <section class="card">
        <h2 class="card__title">Intensity</h2>
        <label class="field">
          <span class="field__label">Overlay strength</span>
          <input id="overlayAlpha" class="field__control" type="range" min="0" max="100" value="35" />
        </label>
        <div class="row">
          <div class="pill" id="overlayAlphaValue">35%</div>
          <button class="button" id="reset">Reset</button>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">Text</h2>
        <label class="field">
          <span class="field__label">Font size</span>
          <input id="fontSize" class="field__control" type="range" min="14" max="28" value="18" />
        </label>
        <div class="pill" id="fontSizeValue">18px</div>

        <label class="field">
          <span class="field__label">Line height</span>
          <input id="lineHeight" class="field__control" type="range" min="1.2" max="2.0" step="0.05" value="1.6" />
        </label>
        <div class="pill" id="lineHeightValue">1.6</div>
      </section>
    </aside>
  </main>

  <!-- app.js initializes the UI + preset logic -->
  <script src="../static/app.js"></script>
  <script src="popup.js"></script>
</body>
</html>
